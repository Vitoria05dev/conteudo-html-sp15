<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 15 - HTML</title>
    </head>
    <body>

        <h1>Caminhos de Arquivos no HTML</h1>

        <h3>Arquivo no mesmo nível no HTML</h3>

        <img src="kanagawa.jpg" width="200" height="100">

        <hr>

        <h3>Arquivo em uma pasta do mesmo nível que o HTML</h3>

        <img src="img/kanagawa.jpg" width="200" height="100">

        <hr>

        <h3>Arquivo em uma pasta na raiz da estrutura</h3>

        <img src="/Aula15-img/kanagawa.jpg" width="200" height="100">

        <hr>

        <h3>Arquivo em nível maior que o HTML</h3>

        <img src="../kanagawa.jpg" width="200" height="100">




    </body>
</html>
