<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula 16 - HTML</title>
</head>
<body>

    <h1>Introdução a Formulário no HTML</h1>

    <form>

        <label for="p-nome">Primeiro Nome</label><br>
        <input type="text" name="p-nome" id="p-nome"><br>

        <label for="u-nome">Último Nome:</label><br>
        <input type="text" name="u-nome" id="u-nome"><br>

        <input type="button" value="Enviar Dados">

        <hr>

        <h3>Input tipo Radio</h3>

        <form>
            <input type="radio" name="tec-opcoes" id="html" valve="HTML">
            <label for="html">HTML</label>
            <br>
            <input type="radio" name="tec-opcoes" id="CSS" valve="CSS">
            <label for="css">CSS</label>
            <br>
            <input type="radio" name="tec-opcoes" id="js" valve="JavaScript">
            <label for="js">JavaScript</label>
            <br>

        </form>




    </form>

    
</body>
</html>
