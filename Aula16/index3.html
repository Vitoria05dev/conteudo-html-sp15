<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula 16 - HTML</title>
</head>
<body>

    <h1>Introdução a Formulário no HTML</h1>

    <form>

        <label for="p-nome">Primeiro Nome</label><br>
        <input type="text" name="p-nome" id="p-nome"><br>

        <label for="u-nome">Último Nome:</label><br>
        <input type="text" name="u-nome" id="u-nome"><br>

        <input type="button" value="Enviar Dados">

        <hr>

        <h3>Input tipo Radio</h3>

        <form>
            <input type="radio" name="tec-opcoes" id="html" valve="HTML">
            <label for="html">HTML</label>
            <br>
            <input type="radio" name="tec-opcoes" id="CSS" valve="CSS">
            <label for="css">CSS</label>
            <br>
            <input type="radio" name="tec-opcoes" id="js" valve="JavaScript">
            <label for="js">JavaScript</label>
            <br>

        </form>




    </form>

    <hr>

    <h3>Input tipo Checkbox</h3>

    <form>
        <input type="checkbox" name="fruta1" id="laranja" valve="Laranja">
        <label for="laranja">Laranja</label>
        <br>

        <input type="checkbox" name="fruta2" id="morango" valve="Morango">
        <label for="morango">Morango</label>
        <br>

        <input type="checkbox" name="fruta3" id="uva" valve="Uva">
        <label for="uva">Uva</label>
        <br>

    </form>

    <hr>

    <h3>Input tipo Submit</h3>

    <form action="./index.html">
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome">
        <input type="submit" valve="Enviar">
    </form>

    
</body>
</html>
